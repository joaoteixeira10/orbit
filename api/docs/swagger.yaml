      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  api.commentRequest:
    properties:
      body:
        maxLength: 10000
        type: string
    required:
    - body
    type: object
  api.commentResponse:
    properties:
      author_avatar:
        type: string
      author_id:
        type: string
      author_name:
        type: string
      body:
        type: string
      created_at:
        type: string
      edited_at:
        type: string
      git_author:
        type: string
      git_error:
        description: saved, but not on the issue
        type: string
      id:
        type: string
      task_id:
        type: string
      updated_at:
        type: string
      workspace_id:
        type: string
    type: object
  api.courseRequest:
    properties:
      code:
        maxLength: 16
        type: string
      color:
        type: string
      name:
        maxLength: 120
        type: string
      notes:
        maxLength: 20000
        type: string
      room:
        maxLength: 60
        type: string
      slots:
        items:
          $ref: '#/definitions/api.slotRequest'
        maxItems: 40
        type: array
      tag:
        maxLength: 40
        type: string
      teacher:
        maxLength: 120
        type: string
      term_end:
        type: string
      term_start:
        description: '"" clears'
        type: string
      tz:
        type: string
      weight:
        maximum: 100
        minimum: 0
        type: number
    type: object
  api.courseResponse:
    properties:
      average:
        description: the caller's, on the workspace's scale
        type: number
      code:
        description: short name for the timetable (MAT)
        type: string
      color:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      grade_count:
        type: integer
      id:
        type: string
      name:
        type: string
      notes:
        type: string
      open_tasks:
        description: 'not done, tagged #tag'
        type: integer
      page_id:
        description: its notes page
        type: string
      rank:
        type: number
      room:
        type: string
      slots:
        items:
          $ref: '#/definitions/models.CourseSlot'
        type: array
      tag:
        description: 'its tasks carry #tag'
        type: string
      target:
        description: the caller's goal, on the scale
        type: number
      teacher:
        type: string
      term_end:
        description: 'YYYY-MM-DD: classes until (inclusive)'
        type: string
      term_start:
        description: 'YYYY-MM-DD: classes from'
        type: string
      tz:
        description: the zone its class times are in
        type: string
      updated_at:
        type: string
      weight:
        type: number
      workspace_id:
        type: string
