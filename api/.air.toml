# air live-reload config for the dev API (see docker-compose.dev.yml).
# Watches the Go sources and rebuilds + restarts the server on save, so a
# `git pull` or local edit is picked up without manually restarting the
# container. Dev-only — the production image still builds the static binary.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  bin = "./tmp/server"
  include_ext = ["go"]
  exclude_dir = ["tmp", "docs"]
  exclude_regex = ["_test\\.go"]
  delay = 500            # ms to debounce rapid saves
  stop_on_error = true
  send_interrupt = true  # graceful shutdown before restart
  kill_delay = "2s"
  # Bind-mounts on Docker Desktop (macOS/Windows) don't deliver inotify events,
  # so poll the filesystem instead — otherwise edits/`git pull`s aren't seen.
  poll = true
  poll_interval = 500    # ms

[log]
  time = true

[misc]
  clean_on_exit = true
