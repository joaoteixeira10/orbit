<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Orbit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D9BFF"/>
      <stop offset="0.55" stop-color="#2F6BF2"/>
      <stop offset="1" stop-color="#5E4BDB"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.65" stop-color="#EEF3FF"/>
      <stop offset="1" stop-color="#C6D7FF"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- In the ring's rotated frame: its near (lower) half, drawn over the planet -->
    <clipPath id="front" clipPathUnits="userSpaceOnUse">
      <rect x="0" y="262" width="512" height="250"/>
    </clipPath>
  </defs>
  <!-- App-icon tile -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect width="512" height="512" rx="115" fill="url(#sheen)"/>
  <!-- The ring behind the planet -->
  <g transform="rotate(-22 256 262)">
    <ellipse cx="256" cy="262" rx="190" ry="64" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="20"/>
  </g>
  <!-- The planet -->
  <circle cx="256" cy="262" r="100" fill="url(#planet)"/>
  <!-- The ring in front of it -->
  <g transform="rotate(-22 256 262)" clip-path="url(#front)">
    <ellipse cx="256" cy="262" rx="190" ry="64" fill="none" stroke="#FFFFFF" stroke-width="20"/>
  </g>
  <!-- A moon -->
  <circle cx="386" cy="138" r="24" fill="#FFFFFF"/>
</svg>
