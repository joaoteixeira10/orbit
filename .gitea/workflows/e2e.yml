# End-to-end (Playwright). Builds the single binary (SPA embedded), then in ONE
# step boots it and runs the browser tests against it — the server must stay up
# for the whole test, and a backgrounded process from a previous step does NOT
# survive into the next on act_runner. Runs on every PR + on demand, in
# Playwright's own image (see container: below).
name: E2E

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: e2e-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Inside Playwright's own image (Ubuntu 24.04, Chromium and its system
    # libraries already there), whatever Ubuntu the runner's default image
    # moves to: Playwright supports only the releases it was built for (1.60
    # refused the runner's 26.04). Keep its tag on the version in
    # web/package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
    # A CalDAV server for the two-way calendar test (any password). Reached
    # by its service name — a private address the guarded dialer allows
    # (localhost it refuses).
    services:
      radicale:
        image: tomsquest/docker-radicale:3.9.0.0
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26.11"
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Build SPA + embed + build binary
        run: |
          (cd web && npm run build)
          rm -rf api/internal/webui/dist
          cp -r web/dist api/internal/webui/dist
          (cd api && go build -o /tmp/orbit ./cmd/server)

      - name: Run E2E (server + tests in one step)
        working-directory: web
        env:
          DB_DRIVER: sqlite
          DB_URL: /tmp/e2e-orbit.db
          ORBIT_MASTER_KEY: e2e-master-key-please-32-bytes-minimum
          JWT_SECRET: e2e-jwt-secret-please-32-bytes-minimum!!
          ADMIN_USER: admin
          ADMIN_PASSWORD: admin123
          GIN_MODE: debug
          HTTP_ADDR: ":8080"
          # Every test signs in; keep the sign-in rate limit out of the way.
          AUTH_RATE_BURST: "50"
          AUTH_RATE_PER_MINUTE: "600"
          E2E_BASE_URL: http://localhost:8080
          E2E_CALDAV_URL: http://radicale:5232
        run: |
          /tmp/orbit & SRV=$!
          trap 'kill "$SRV" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/api/v1/readyz >/dev/null 2>&1 && break
            sleep 1
          done
          npm run e2e
