# Prometheus alerting rules for Orbit.
# Load via prometheus.yml: rule_files: ["prometheus-alerts.yml"].
# Assumes the scrape job is labelled job="orbit". Tune the thresholds.
groups:
  - name: orbit
    rules:
      - alert: OrbitDown
        expr: up{job="orbit"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Orbit is down"
          description: "{{ $labels.instance }} has been unreachable for 5 minutes."

      - alert: OrbitServerErrors
        expr: |
          sum(rate(orbit_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(orbit_http_requests_total[5m])), 1e-9) > 0.02
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Orbit answers more than 2% of requests with errors"
          description: "{{ $value | humanizePercentage }} of the requests failed with 5xx over 5 minutes."

      - alert: OrbitSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(orbit_http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Orbit is slow"
          description: "95% of requests take up to {{ $value | printf \"%.2f\" }} s."

      - alert: OrbitSignInFailures
        expr: sum(rate(orbit_logins_total{result="failure"}[10m])) * 600 > 30
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Many failed sign-ins"
          description: "About {{ $value | printf \"%.0f\" }} failed sign-ins in 10 minutes: someone may be guessing passwords."

      - alert: OrbitCalendarSubscriptionsFailing
        expr: orbit_calendar_subscriptions_failing > 0
        for: 6h
        labels: { severity: info }
        annotations:
          summary: "Subscribed calendars can't be fetched"
          description: "{{ $value }} subscription(s) failed their last refresh for 6 hours (the error shows in the workspace's Calendars sheet)."
