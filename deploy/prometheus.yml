# Prometheus config for the turnkey stack (docker-compose.monitoring.yml).
# Scrapes Orbit's /metrics (METRICS_ENABLED=true). If Orbit runs in the
# same compose project, use its service name, e.g. "api:8080".
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

scrape_configs:
  - job_name: orbit
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
