  api.createAPITokenRequest:
    properties:
      expires_in_days:
        description: 0 = never expires
        type: integer
      name:
        type: string
      privileges:
        description: |-
          Optional narrowing (never widens the owner's rights): only these
          instance privileges, and read-only access to workspace content.
        items:
          type: string
        type: array
      read_only:
        type: boolean
    required:
    - name
    type: object
  api.createFeedRequest:
