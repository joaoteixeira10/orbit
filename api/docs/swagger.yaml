        description: username or email
        type: string
    required:
    - role
    - user
    type: object
  api.backlinkTask:
    properties:
      done:
        type: boolean
      id:
        type: string
      list_id:
        type: string
      title:
        type: string
    type: object
  api.backlinksResponse:
    properties:
      pages:
        items:
          $ref: '#/definitions/api.pageSummary'
        type: array
      tasks:
        items:
          $ref: '#/definitions/api.backlinkTask'
        type: array
    type: object
  api.backupExportRequest:
    properties:
      passphrase:
        description: |-
          Passphrase (12+ characters): a portable archive, opened with it instead
          of ORBIT_MASTER_KEY. Empty = sealed with the master key.
        type: string
    type: object
  api.backupScheduleView:
    properties:
      dest:
        description: '"dir" (default) or "s3"'
        type: string
      dir:
        type: string
      enabled:
        type: boolean
      interval_hours:
        type: integer
      keep:
        description: 0 = keep all
        type: integer
      last:
        $ref: '#/definitions/backup.LastRun'
