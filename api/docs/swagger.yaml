info:
  contact: {}
  description: 'Workspaces for school, work and life: pages, tasks, boards and calendars.'
  title: Orbit API
  version: 0.1.0
paths:
  /about:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: About / version info
      tags:
      - system
  /api-tokens:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.APIToken'
            type: array
      security:
      - BearerAuth: []
      summary: List all API tokens (admin)
      tags:
      - users
  /api-tokens/{id}:
    delete:
      parameters:
      - description: Token id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Revoke any API token (admin)
      tags:
      - users
  /audit:
    get:
      parameters:
      - description: Page number (1-based)
        in: query
        name: page
        type: integer
      - description: Page size (default 50, max 500)
        in: query
        name: per_page
        type: integer
      - description: Search action, detail, IP or user name
        in: query
        name: q
        type: string
      - description: Only these actions (comma-separated)
        in: query
        name: actions
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List audit log (paginated)
      tags:
      - audit
  /audit/export:
    get:
      parameters:
      - description: Search action, detail, IP or user name
        in: query
        name: q
        type: string
      - description: Only these actions (comma-separated)
        in: query
        name: actions
        type: string
      produces:
      - text/csv
