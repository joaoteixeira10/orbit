# Orbit — production: one container (Go API + embedded SPA) and a volume.
# Runs the published multi-arch image (built by the "Build & Push" workflow).
# Pin a version in .env — e.g. ORBIT_VERSION=v0.1.0 — then:
#   docker compose pull && docker compose up -d
# TLS: terminate it upstream (reverse proxy), or set TLS_CERT_FILE / TLS_KEY_FILE.
# First sign-in: see "First sign-in" in the README (the first admin's temporary
# password is printed once in the log when ADMIN_PASSWORD is empty).

services:
  api:
    image: ${ORBIT_IMAGE:-ghcr.io/joaoteixeira10/orbit}:${ORBIT_VERSION:-latest}
    ports:
      - "${ORBIT_PORT:-8080}:8080"
    # Pass the whole .env so every documented setting takes effect; the
    # environment: block still wins per key (release mode + required secrets).
    env_file:
      - .env
    environment:
      GIN_MODE: release
      DB_DRIVER: sqlite
      DB_URL: /data/orbit.db
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ORBIT_MASTER_KEY: ${ORBIT_MASTER_KEY:?set ORBIT_MASTER_KEY in .env}
    volumes:
      - orbit-data:/data
      # Automatic backups to a directory (Owner → Owner → Backups → /backups):
      # - ./backups:/backups
    restart: unless-stopped

  # Optional: PostgreSQL instead of the SQLite file. Set in .env:
  #   DB_DRIVER=postgres
  #   DB_URL=postgres://orbit:<password>@db:5432/orbit?sslmode=disable
  # and remove DB_DRIVER / DB_URL from the api service's environment above.
  # Back it up with pg_dump (Orbit's own backups are of SQLite).
  # db:
  #   image: postgres:17-alpine
  #   environment:
  #     POSTGRES_USER: orbit
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  #     POSTGRES_DB: orbit
  #   volumes:
  #     - orbit-pg:/var/lib/postgresql/data
  #   restart: unless-stopped

  # Optional: your own draw.io editor for Diagrams, so nothing loads from
  # draw.io's site. Put it behind your proxy on HTTPS, then set
  # DRAWIO_URL=https://drawio.example.org in .env (or Owner → Owner →
  # Diagrams). Pin a version you've checked.
  # drawio:
  #   image: jgraph/drawio:latest
  #   ports:
  #     - "${DRAWIO_PORT:-8081}:8080"
  #   restart: unless-stopped

volumes:
  orbit-data:
