basePath: /api/v1
definitions:
  api.SmartFilter:
    properties:
      assignee:
        description: user ids, "me", "none"
        items:
          type: string
        type: array
      due:
        description: overdue, today, week, next, later, none
        items:
          type: string
        type: array
      lists:
        items:
          type: string
        type: array
      priority:
        description: 0 none … 3 high
        items:
          type: integer
        type: array
      progress:
        description: notStarted, inProgress, done
        items:
          type: string
        type: array
      q:
        type: string
      tags:
        items:
          type: string
        type: array
    type: object
  api.activityLine:
    properties:
      actor_avatar:
        type: string
      actor_id:
        type: string
      actor_name:
        type: string
      created_at:
        type: string
      id:
        type: string
      link:
        type: string
      title:
        type: string
      updated_at:
        type: string
      verb:
        type: string
      workspace_id:
        type: string
    type: object
  api.activityResponse:
    properties:
      actor_id:
        type: string
      actor_name:
        type: string
      created_at:
        type: string
      id:
        type: string
      kind:
        type: string
      params:
        additionalProperties: {}
        type: object
    type: object
