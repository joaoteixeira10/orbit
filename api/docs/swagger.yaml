basePath: /api/v1
definitions:
  api.addMemberRequest:
    properties:
      role:
        enum:
        - owner
        - editor
        - viewer
        type: string
      user:
        description: username or email
        type: string
    required:
    - role
    - user
    type: object
  api.backupExportRequest:
    properties:
      passphrase:
        description: |-
          Passphrase (12+ characters): a portable archive, opened with it instead
          of ORBIT_MASTER_KEY. Empty = sealed with the master key.
        type: string
    type: object
  api.backupScheduleView:
    properties:
      dest:
        description: '"dir" (default) or "s3"'
        type: string
      dir:
        type: string
      enabled:
        type: boolean
      interval_hours:
        type: integer
      keep:
        description: 0 = keep all
        type: integer
      last:
        $ref: '#/definitions/backup.LastRun'
      s3_bucket:
        description: |-
          S3: credentials come from the secrets backend (BACKUP_S3_ACCESS_KEY,
          BACKUP_S3_SECRET_KEY), never from here.
        type: string
      s3_endpoint:
        description: host[:port] (MinIO, …); empty = AWS
        type: string
      s3_prefix:
        type: string
      s3_region:
        type: string
    type: object
  api.brandingResponse:
    properties:
      accent_color:
        type: string
      app_name:
        type: string
      asset_source_favicon:
        description: theme | keep
        type: string
      asset_source_logo:
        description: theme | keep
        type: string
      asset_source_wordmark:
        description: theme | keep
        type: string
      auto_sso:
        description: login page auto-starts SSO (unless ?local=1)
        type: boolean
      developer_theme:
        description: blue | gold | red | ink
        type: string
      developer_themes_enabled:
        type: boolean
      favicon_data_url:
        type: string
      hide_local_login:
        description: hide the password form on /login (when SSO is available)
        type: boolean
      login_message:
        type: string
      logo_data_url:
        type: string
      oidc_enabled:
        description: SPA shows the "Sign in with SSO" button
        type: boolean
      passwordless_enabled:
        description: SPA shows the "Sign in with a passkey" button
        type: boolean
      show_app_name:
        type: boolean
      show_logo:
        description: show the sidebar/login logo mark
        type: boolean
    type: object
  api.calendarResponse:
    properties:
      events:
        items:
          $ref: '#/definitions/api.occurrence'
        type: array
      tasks:
        items:
          $ref: '#/definitions/api.taskResponse'
        type: array
    type: object
  api.changePasswordRequest:
    properties:
      new_password:
        minLength: 8
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  api.createAPITokenRequest:
    properties:
      expires_in_days:
        description: 0 = never expires
        type: integer
      name:
        type: string
      privileges:
        description: |-
          Optional narrowing (never widens the owner's rights): only these
          instance privileges, and read-only access to workspace content.
        items:
          type: string
        type: array
      read_only:
        type: boolean
    required:
    - name
    type: object
  api.createFeedRequest:
    properties:
      include_tasks:
        type: boolean
      name:
        maxLength: 120
        type: string
      workspace_ids:
        description: empty = all of mine
        items:
          type: string
        type: array
    type: object
  api.createPageRequest:
    properties:
      after_id:
        description: AfterID puts the page right after this sibling ("" = at the end).
        type: string
      content:
        type: string
      icon:
        maxLength: 64
        type: string
      parent_id:
        type: string
      title:
        maxLength: 300
        type: string
    type: object
  api.createUserRequest:
    properties:
      display_name:
        type: string
      email:
        type: string
      generate_password:
        type: boolean
      must_change_password:
        type: boolean
      otp_required:
        description: two-factor required for this user
        type: boolean
      password:
        description: required unless GeneratePassword
        type: string
      role_ids:
        items:
          type: string
        type: array
      username:
        type: string
    required:
    - username
    type: object
  api.createWorkspaceRequest:
    properties:
      color:
        type: string
      description:
        maxLength: 500
        type: string
      icon:
        maxLength: 64
        type: string
      kind:
        enum:
        - school
        - work
        - personal
        - shared
        - custom
        type: string
      locale:
        description: names the starter content (en, pt)
        type: string
      modules:
        description: nil = the template's
        items:
          type: string
        type: array
      name:
        maxLength: 120
        type: string
      starter:
        description: Starter creates the template's lists and first pages (default
          true).
        type: boolean
    required:
    - name
    type: object
  api.eventRequest:
    properties:
      all_day:
        type: boolean
      color:
        type: string
      ends_at:
        type: string
      location:
        maxLength: 300
        type: string
      notes:
        maxLength: 20000
        type: string
      remind_minutes:
        description: RemindMinutes before each occurrence; a negative value removes
          the reminder.
        maximum: 40320
        type: integer
      rrule:
        type: string
      starts_at:
        type: string
      title:
        maxLength: 300
        type: string
      tz:
        maxLength: 64
        type: string
    type: object
  api.eventResponse:
    properties:
      all_day:
        type: boolean
      color:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      ends_at:
        type: string
      exdates:
        items:
          type: string
        type: array
      id:
        type: string
      location:
        type: string
      notes:
        type: string
      remind_minutes:
        description: |-
          RemindMinutes reminds the workspace's members this many minutes before
          each occurrence (nil = no reminder).
        type: integer
      rrule:
        type: string
      starts_at:
        type: string
      title:
        type: string
      tz:
        type: string
      until:
        type: string
      updated_at:
        type: string
      workspace_id:
        type: string
    type: object
  api.feedResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      include_tasks:
        type: boolean
      last_used_at:
        type: string
      name:
        type: string
      prefix:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
      workspace_ids:
        items:
          type: string
        type: array
    type: object
  api.gitAccountResponse:
    properties:
      base_url:
        type: string
      checked_at:
        type: string
      id:
        type: string
      kind:
        type: string
      last_error:
        type: string
      login:
        type: string
    type: object
  api.gitAccountsResponse:
    properties:
      accounts:
        items:
          $ref: '#/definitions/api.gitAccountResponse'
        type: array
      servers:
        description: suggested (GIT_SERVERS)
        items:
          type: string
        type: array
    type: object
  api.gitBoardsResponse:
    properties:
      labels:
        items:
          $ref: '#/definitions/gitsync.Label'
        type: array
      projects:
        items:
          $ref: '#/definitions/gitsync.Project'
        type: array
      supported:
        description: the server has the projects API
        type: boolean
    type: object
  api.gitConnectRequest:
    properties:
      base_url:
        maxLength: 255
        type: string
      token:
        maxLength: 255
        type: string
    required:
    - base_url
    - token
    type: object
  api.gitLinkResponse:
    properties:
      host:
        type: string
      last_error:
        type: string
      linked_by:
        type: string
      mode:
        type: string
      owner:
        type: string
      repo:
        type: string
      synced_at:
        type: string
      url:
        type: string
    type: object
  api.gitListRequest:
    properties:
      account_id:
        type: string
      labels:
        description: 'mode labels: one column each, in order'
        items:
          type: string
        type: array
      mode:
        enum:
        - issues
        - labels
        - project
        type: string
      name:
        description: 'default: the repository''s name'
        type: string
      owner:
        maxLength: 100
        type: string
      project_id:
        description: mode project
        type: integer
      repo:
        maxLength: 100
        type: string
    required:
    - account_id
    - mode
    - owner
    - repo
    type: object
  api.gitTaskRequest:
    properties:
      url:
        maxLength: 500
        type: string
    required:
    - url
    type: object
  api.homeResponse:
    properties:
      events:
        items:
          $ref: '#/definitions/api.occurrence'
        type: array
      mine:
        description: Mine is the caller's latest personal notes, not pinned (Today
          only).
        items:
          $ref: '#/definitions/api.noteResponse'
        type: array
      notes:
        description: pinned quick notes
        items:
          $ref: '#/definitions/api.noteResponse'
        type: array
      overdue:
        items:
          $ref: '#/definitions/api.taskResponse'
        type: array
      pages:
        items:
          $ref: '#/definitions/api.pageSummary'
        type: array
      today:
        items:
          $ref: '#/definitions/api.taskResponse'
        type: array
      upcoming:
        items:
          $ref: '#/definitions/api.taskResponse'
        type: array
    type: object
  api.inboxResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/inbox.View'
        type: array
      more:
        type: boolean
      unread:
        type: integer
    type: object
  api.listRequest:
    properties:
      color:
        type: string
      columns:
        items:
          $ref: '#/definitions/planner.Column'
        type: array
      icon:
        maxLength: 64
        type: string
      name:
        maxLength: 120
        type: string
    type: object
  api.listResponse:
    properties:
      archived_at:
        type: string
      color:
        type: string
      columns:
        items:
          $ref: '#/definitions/planner.Column'
        type: array
      created_at:
        type: string
      git:
        $ref: '#/definitions/api.gitLinkResponse'
      icon:
        type: string
      id:
        type: string
      name:
        type: string
      open_count:
        type: integer
      rank:
        type: number
      updated_at:
        type: string
      workspace_id:
        type: string
    type: object
  api.loginRequest:
    properties:
      otp:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  api.memberResponse:
    properties:
      avatar_url:
        type: string
      display_name:
        type: string
      joined_at:
        type: string
      role:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  api.memberRoleRequest:
    properties:
      role:
        enum:
        - owner
        - editor
        - viewer
        type: string
    required:
    - role
    type: object
  api.moveNoteRequest:
    properties:
      workspace_id:
        description: '"" = my own notes'
        type: string
    type: object
  api.movePageRequest:
    properties:
      after_id:
        description: sibling to follow; "^" = first; "" = last
        type: string
      parent_id:
        description: null = top level
        type: string
    type: object
  api.moveTaskRequest:
    properties:
      after_id:
        description: '"^" = first, "" = last'
        type: string
      column_id:
        type: string
      list_id:
        type: string
    required:
    - column_id
    type: object
  api.muteRequest:
    properties:
      muted:
        type: boolean
    type: object
  api.noteItem:
    properties:
      done:
        type: boolean
      id:
        type: string
      text:
        type: string
    type: object
  api.noteRequest:
    properties:
      body:
        maxLength: 20000
        type: string
      checklist:
        type: boolean
      color:
        type: string
      items:
        items:
          $ref: '#/definitions/api.noteItem'
        type: array
      pinned:
        type: boolean
      title:
        maxLength: 300
        type: string
    type: object
  api.noteResponse:
    properties:
      body:
        type: string
      checklist:
        type: boolean
      color:
        description: a colour key (yellow, green, …); "" = plain
        type: string
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/api.noteItem'
        type: array
      owner_id:
        description: personal notes only
        type: string
      pinned:
        type: boolean
      rank:
        type: number
      title:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
      workspace_id:
        type: string
    type: object
  api.occurrence:
    properties:
      all_day:
        type: boolean
      color:
        type: string
      end:
        type: string
      id:
        type: string
      kind:
        description: event | external
        type: string
      location:
        type: string
      notes:
        type: string
      recurring:
        type: boolean
      start:
        type: string
      subscription_id:
        type: string
      title:
        type: string
      workspace_id:
        type: string
    type: object
  api.oidcConfigDTO:
    properties:
      allow_admin:
        description: the IdP may grant admin (superuser) roles
        type: boolean
      client_id:
        type: string
      client_secret:
        description: write-only; placeholder/empty = unchanged
        type: string
      default_role:
        type: string
      enabled:
        type: boolean
      has_secret:
        description: response only
        type: boolean
      issuer:
        type: string
      redirect_url:
        type: string
      role_claim:
        type: string
      scopes:
        type: string
    type: object
  api.oidcExchangeRequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  api.oidcTestRequest:
    properties:
      issuer:
        type: string
    required:
    - issuer
    type: object
  api.orderRequest:
    properties:
      ids:
        items:
          type: string
        type: array
    required:
    - ids
    type: object
  api.otpVerifyRequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  api.pageResponse:
    properties:
      can_edit:
        type: boolean
      content:
        description: |-
          Content is the editor's JSON document; ContentText its plain text, kept
          for search and previews.
        type: string
      cover:
        description: 'a gradient key or #rrggbb; empty = none'
        type: string
      created_at:
        type: string
      created_by:
        type: string
      favorite:
        type: boolean
      icon:
        type: string
      id:
        type: string
      parent_id:
        type: string
      rank:
        type: number
      title:
        type: string
      trashed_at:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
      version:
        type: integer
      workspace_id:
        type: string
    type: object
  api.pageSummary:
    properties:
      favorite:
        type: boolean
      icon:
        type: string
      id:
        type: string
      parent_id:
        type: string
      rank:
        type: number
      title:
        type: string
      trashed_at:
        type: string
      updated_at:
        type: string
      workspace_id:
        type: string
    type: object
  api.prefsResponse:
    properties:
      accent_color:
        type: string
      digest_enabled:
        type: boolean
      digest_time:
        type: string
      locale:
        type: string
      notify_channels:
        items:
          type: string
        type: array
      notify_events:
        type: boolean
      notify_prefs:
        additionalProperties:
          $ref: '#/definitions/inbox.Delivery'
        description: NotifyPrefs is where each kind of notification goes besides the
          inbox.
        type: object
      page_editor:
        description: visual | markdown
        type: string
      theme:
        $ref: '#/definitions/models.Theme'
      time_format:
        type: string
      timezone:
        type: string
      week_start:
        type: integer
    type: object
  api.pushInfoResponse:
    properties:
      available:
        type: boolean
      devices:
        items:
          $ref: '#/definitions/models.PushSubscription'
        type: array
      public_key:
        type: string
    type: object
  api.pushSubscribeRequest:
    properties:
      endpoint:
        type: string
      keys:
        properties:
          auth:
            maxLength: 100
            type: string
          p256dh:
            maxLength: 200
            type: string
        required:
        - auth
        - p256dh
        type: object
    required:
    - endpoint
    type: object
  api.pushUnsubscribeRequest:
    properties:
      endpoint:
        type: string
      id:
        type: string
    type: object
  api.readRequest:
    properties:
      all:
        type: boolean
      ids:
        items:
          type: string
        type: array
    type: object
  api.refreshRequest:
    properties:
      refresh_token:
        description: 'Optional: browsers send the refresh token via the HttpOnly cookie
          instead.'
        type: string
    type: object
  api.resetPasswordRequest:
    properties:
      generate:
        type: boolean
      must_change_password:
        description: |-
          MustChangePassword forces the user to replace the password on next
          sign-in. Defaults to true when omitted (an admin-set password is temporary).
        type: boolean
      new_password:
        description: |-
          NewPassword (>= 8 characters), or Generate for a one-time temporary
          password that is returned once.
        type: string
    type: object
  api.roleRequest:
    properties:
      description:
        type: string
      global_privileges:
        items:
          type: string
        type: array
      name:
        type: string
    required:
    - name
    type: object
  api.roleResponse:
    properties:
      builtin:
        type: boolean
      description:
        type: string
      global_privileges:
        items:
          type: string
        type: array
      id:
        type: string
      name:
        type: string
      superuser:
        type: boolean
    type: object
  api.searchHit:
    properties:
      done:
        type: boolean
      due:
        type: string
      icon:
        type: string
      id:
        type: string
      kind:
        description: page | task | event | note
        type: string
      list_id:
        type: string
      snippet:
        type: string
      start:
        type: string
      title:
        type: string
      workspace_id:
        type: string
    type: object
  api.securityConfigRequest:
    properties:
      auto_sso:
        type: boolean
      hide_local_login:
        type: boolean
      otp_enforced:
        type: boolean
      passwordless_enabled:
        type: boolean
    type: object
  api.subscriptionRequest:
    properties:
      color:
        type: string
      name:
        maxLength: 120
        type: string
      refresh_minutes:
        maximum: 10080
        minimum: 15
        type: integer
      url:
        maxLength: 2000
        type: string
    type: object
  api.taskRequest:
    properties:
      after_id:
        description: 'create: place after this task ("" = at the end)'
        type: string
      assignee_id:
        type: string
      column_id:
        type: string
      completed:
        type: boolean
      due:
        description: YYYY-MM-DD, "" clears
        type: string
      due_time:
        description: HH:MM, "" clears
        type: string
      list_id:
        type: string
      notes:
        maxLength: 20000
        type: string
      parent_id:
        type: string
      priority:
        maximum: 3
        minimum: 0
        type: integer
      repeat:
        description: RRULE, "" clears
        type: string
      start:
        description: YYYY-MM-DD, "" clears
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        maxLength: 500
        type: string
    type: object
  api.taskResponse:
    properties:
      assignee_id:
        description: |-
          AssigneeID is who it's for in a shared workspace (reminders go to them;
          nil = to whoever created it).
        type: string
      column_id:
        type: string
      completed_at:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      done:
        type: boolean
      due:
        description: YYYY-MM-DD
        type: string
      due_time:
        description: HH:MM
        type: string
      git_dirty:
        description: a change didn't reach git yet (retried by the sync)
        type: boolean
      git_error:
        description: |-
          GitError: the change is saved but didn't reach the linked issue (the
          sync tries again).
        type: string
      git_host:
        description: |-
          The git issue (or pull request) this task is, when it is one: a task
          of a git-linked list, or a task linked by hand. GitIssueID is the
          server's global id; GitRepo is "owner/repo" on GitHost (a base URL).
        type: string
      git_number:
        type: integer
      git_pull:
        type: boolean
      git_repo:
        type: string
      git_state:
        description: open | closed | merged
        type: string
      git_url:
        type: string
      id:
        type: string
      list_id:
        type: string
      notes:
        type: string
      parent_id:
        type: string
      priority:
        description: 0 none, 1 low, 2 medium, 3 high
        type: integer
      rank:
        type: number
      repeat:
        type: string
      start:
        description: YYYY-MM-DD, on or before Due
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      updated_at:
        type: string
      workspace_id:
        type: string
    type: object
  api.testNotifRequest:
    properties:
      channel:
        type: string
    required:
    - channel
    type: object
  api.tokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        description: The refresh token is delivered as an HttpOnly cookie, never in
          the body.
        type: integer
      user:
        $ref: '#/definitions/models.User'
    type: object
  api.transferOwnerRequest:
    properties:
      user_id:
        type: string
    required:
    - user_id
    type: object
  api.updatePageRequest:
    properties:
      content:
        type: string
      cover:
        maxLength: 64
        type: string
      icon:
        maxLength: 64
        type: string
      title:
        maxLength: 300
        type: string
      version:
        description: |-
          Version is the version the editor started from; required with content.
          A newer save by someone else makes this a 409 with the current page.
        type: integer
    type: object
  api.updatePrefsRequest:
    properties:
      accent_color:
        description: '#rrggbb or "" (validated in the handler)'
        type: string
      device_tz:
        maxLength: 64
        type: string
      digest_enabled:
        type: boolean
      digest_time:
        description: HH:MM
        type: string
      locale:
        maxLength: 8
        type: string
      notify_channels:
        items:
          type: string
        type: array
      notify_events:
        type: boolean
      notify_prefs:
        additionalProperties:
          $ref: '#/definitions/inbox.Delivery'
        description: |-
          Per kind (reminder, assigned, workspace, activity, digest): also to my
          devices (push) and/or my channels.
        type: object
      page_editor:
        enum:
        - visual
        - markdown
        type: string
      theme:
        allOf:
        - $ref: '#/definitions/models.Theme'
        enum:
        - light
        - dark
        - system
      time_format:
        enum:
        - 24h
        - 12h
        type: string
      timezone:
        type: string
      week_start:
        enum:
        - 0
        - 1
        type: integer
    type: object
  api.updateProfileRequest:
    properties:
      avatar_url:
        type: string
      display_name:
        type: string
      email:
        type: string
    type: object
  api.updateSettingsRequest:
    properties:
      accent_color:
        type: string
      app_name:
        type: string
      asset_source_favicon:
        type: string
      asset_source_logo:
        type: string
      asset_source_wordmark:
        type: string
      developer_theme:
        type: string
      developer_themes_enabled:
        type: boolean
      favicon_data_url:
        type: string
      login_message:
        type: string
      logo_data_url:
        type: string
      show_app_name:
        type: boolean
      show_logo:
        type: boolean
    type: object
  api.updateUserRequest:
    properties:
      disabled:
        type: boolean
      display_name:
        type: string
      email:
        type: string
      otp_required:
        type: boolean
      role_ids:
        items:
          type: string
        type: array
    type: object
  api.updateWorkspaceRequest:
    properties:
      archived:
        type: boolean
      color:
        type: string
      description:
        maxLength: 500
        type: string
      icon:
        maxLength: 64
        type: string
      modules:
        items:
          type: string
        type: array
      name:
        maxLength: 120
        type: string
    type: object
  api.webauthnRenameRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  api.workspaceResponse:
    properties:
      archived_at:
        type: string
      color:
        description: '#rrggbb; tints the workspace'
        type: string
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      icon:
        description: an icon key (lucide name) or an emoji
        type: string
      id:
        type: string
      kind:
        description: school | work | personal | shared | custom
        type: string
      member_count:
        type: integer
      modules:
        items:
          type: string
        type: array
      muted:
        description: the caller muted its activity
        type: boolean
      name:
        type: string
      position:
        type: number
      role:
        type: string
      updated_at:
        type: string
    type: object
  audit.VerifyResult:
    properties:
      broken_at:
        description: id of the first bad entry ("" if OK)
        type: string
      checked:
        type: integer
      ok:
        type: boolean
      reason:
        type: string
    type: object
  backup.LastRun:
    properties:
      at:
        type: string
      error:
        type: string
      ok:
        type: boolean
      where:
        description: the file or s3:// location
        type: string
    type: object
  backup.Schedule:
    properties:
      dest:
        description: '"dir" (default) or "s3"'
        type: string
      dir:
        type: string
      enabled:
        type: boolean
      interval_hours:
        type: integer
      keep:
        description: 0 = keep all
        type: integer
      s3_bucket:
        description: |-
          S3: credentials come from the secrets backend (BACKUP_S3_ACCESS_KEY,
          BACKUP_S3_SECRET_KEY), never from here.
        type: string
      s3_endpoint:
        description: host[:port] (MinIO, …); empty = AWS
        type: string
      s3_prefix:
        type: string
      s3_region:
        type: string
    type: object
  gitsync.Label:
    properties:
      color:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  gitsync.Project:
    properties:
      id:
        type: integer
      state:
        type: string
      title:
        type: string
    type: object
  gitsync.Repo:
    properties:
      description:
        type: string
      full_name:
        type: string
      html_url:
        type: string
      id:
        type: integer
      name:
        type: string
      owner:
        $ref: '#/definitions/gitsync.User'
      private:
        type: boolean
    type: object
  gitsync.User:
    properties:
      id:
        type: integer
      login:
        type: string
    type: object
  inbox.Delivery:
    properties:
      channels:
        description: the channels they picked (email, ntfy, …)
        type: boolean
      push:
        description: this user's devices (Web Push)
        type: boolean
    type: object
  inbox.View:
    properties:
      actor_id:
        type: string
      count:
        type: integer
      created_at:
        type: string
      id:
        type: string
      kind:
        type: string
      link:
        type: string
      params:
        additionalProperties: {}
        type: object
      read:
        type: boolean
      updated_at:
        type: string
      verb:
        type: string
      workspace_id:
        type: string
    type: object
  models.APIToken:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      last_used_at:
        type: string
      name:
        type: string
      prefix:
        type: string
      privileges:
        description: Decoded scope for API responses (set in AfterFind / by the handler).
        items:
          type: string
        type: array
      read_only:
        type: boolean
      updated_at:
        type: string
      user_id:
        type: string
      username:
        description: Username of the token's owner (admin list only).
        type: string
    type: object
  models.CalendarSubscription:
    properties:
      color:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      event_count:
        type: integer
      fetched_at:
        type: string
      id:
        type: string
      last_error:
        type: string
      name:
        type: string
      refresh_minutes:
        type: integer
      updated_at:
        type: string
      url_host:
        description: shown instead of the URL
        type: string
      workspace_id:
        type: string
    type: object
  models.PushSubscription:
    properties:
      created_at:
        type: string
      id:
        type: string
      last_used_at:
        type: string
      updated_at:
        type: string
      user_agent:
        type: string
    type: object
  models.Role:
    properties:
      builtin:
        type: boolean
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      superuser:
        type: boolean
      updated_at:
        type: string
    type: object
  models.Theme:
    enum:
    - light
    - dark
    - system
    type: string
    x-enum-varnames:
    - ThemeLight
    - ThemeDark
    - ThemeSystem
  models.User:
    properties:
      avatar_url:
        description: data URL
        type: string
      created_at:
        type: string
      disabled:
        type: boolean
      display_name:
        type: string
      email:
        type: string
      has_passkey:
        description: |-
          HasPasskey (set by the user list) reports a registered passkey, which
          counts as the second factor.
        type: boolean
      id:
        type: string
      last_login_at:
        description: LastLoginAt is the last completed sign-in (password, SSO or passkey).
        type: string
      locked_until:
        description: |-
          LockedUntilView (derived) is LockedUntil while a lockout is active, for
          the admin's user list; nil otherwise.
        type: string
      must_change_password:
        description: MustChangePassword forces a password change before any other
          action.
        type: boolean
      needs_otp_setup:
        description: |-
          NeedsOTPSetup (set by the user list): two-factor is required for this
          user (by the policy or per user) but not set up yet.
        type: boolean
      oidc:
        description: |-
          OIDC is a derived flag (set by AfterFind): true for SSO-provisioned
          accounts, whose identity fields are managed by the identity provider.
        type: boolean
      otp_enabled:
        type: boolean
      otp_required:
        description: |-
          OTPRequired makes a second factor mandatory for this one user, on top of
          the instance-wide otp_enforced policy (an LB Admin addition to the PKI model).
        type: boolean
      prefs:
        $ref: '#/definitions/models.UserPrefs'
      roles:
        description: Roles are the assigned RBAC roles; effective access is their
          union.
        items:
          $ref: '#/definitions/models.Role'
        type: array
      updated_at:
        type: string
      username:
        type: string
    type: object
  models.UserPrefs:
    properties:
      accent_color:
        description: |-
          AccentColor is a personal #rrggbb accent that overrides the org accent for
          this user only (empty = follow the org/developer-theme accent).
        type: string
      created_at:
        type: string
      device_tz:
        description: |-
          DeviceTZ is the zone the browser last reported, used for reminders
          while Timezone is "local".
        type: string
      digest_enabled:
        description: |-
          The daily summary: on or off, at "HH:MM" in the user's zone; DigestSent
          is the local date it was last sent.
        type: boolean
      digest_time:
        type: string
      id:
        type: string
      locale:
        description: |-
          Locale is the interface language (en, pt), for text sent from the
          server: push notifications, channels, the summary.
        type: string
      notify_events:
        description: |-
          Notifications: master toggle for reminders (tasks due, events starting)
          + chosen channel keys (JSON []string), restricted to the channels the
          admin has enabled.
        type: boolean
      page_editor:
        description: |-
          PageEditor is how this user edits pages: "visual" (blocks, the default)
          or "markdown" (the source). Pages are Markdown either way.
        type: string
      theme:
        $ref: '#/definitions/models.Theme'
      time_format:
        description: TimeFormat is "24h" or "12h".
        type: string
      timezone:
        description: '"local" = device/browser zone'
        type: string
      updated_at:
        type: string
      user_id:
        type: string
      week_start:
        description: 'WeekStart is the first day of the week in calendars: 1 = Monday,
          0 = Sunday.'
        type: integer
    type: object
  models.WebAuthnCredential:
    properties:
      backed_up:
        type: boolean
      backup_eligible:
        type: boolean
      created_at:
        type: string
      id:
        type: string
      last_used_at:
        type: string
      name:
        description: user-given label
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  notify.Config:
    properties:
      discord:
        $ref: '#/definitions/notify.DiscordConfig'
      email:
        $ref: '#/definitions/notify.EmailConfig'
      gotify:
        $ref: '#/definitions/notify.GotifyConfig'
      ntfy:
        $ref: '#/definitions/notify.NtfyConfig'
      slack:
        $ref: '#/definitions/notify.SlackConfig'
      teams:
        $ref: '#/definitions/notify.TeamsConfig'
      telegram:
        $ref: '#/definitions/notify.TelegramConfig'
      webhook:
        $ref: '#/definitions/notify.WebhookConfig'
    type: object
  notify.DiscordConfig:
    properties:
      enabled:
        type: boolean
      webhook_url:
        type: string
    type: object
  notify.EmailConfig:
    properties:
      enabled:
        type: boolean
      from:
        type: string
      host:
        type: string
      password:
        type: string
      port:
        type: integer
      start_tls:
        type: boolean
      username:
        type: string
    type: object
  notify.GotifyConfig:
    properties:
      enabled:
        type: boolean
      server_url:
        type: string
      token:
        type: string
    type: object
  notify.NtfyConfig:
    properties:
      enabled:
        type: boolean
      server_url:
        type: string
      token:
        type: string
      topic:
        type: string
    type: object
  notify.SlackConfig:
    properties:
      enabled:
        type: boolean
      webhook_url:
        type: string
    type: object
  notify.TeamsConfig:
    properties:
      enabled:
        type: boolean
      webhook_url:
        type: string
    type: object
  notify.TelegramConfig:
    properties:
      bot_token:
        type: string
      chat_id:
        type: string
      enabled:
        type: boolean
    type: object
  notify.WebhookConfig:
    properties:
      enabled:
        type: boolean
      secret:
        description: HMAC-SHA256 key; payload signed in X-Orbit-Signature
        type: string
      url:
        type: string
    type: object
  planner.Column:
    properties:
      color:
        type: string
      done:
        type: boolean
      id:
        type: string
      name:
        type: string
    type: object
info:
  contact: {}
  description: 'Workspaces for school, work and life: pages, tasks, boards and calendars.'
  title: Orbit API
  version: 0.1.0
paths:
  /about:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: About / version info
      tags:
      - system
  /api-tokens:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.APIToken'
            type: array
      security:
      - BearerAuth: []
      summary: List all API tokens (admin)
      tags:
      - users
  /api-tokens/{id}:
    delete:
      parameters:
      - description: Token id
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Revoke any API token (admin)
      tags:
      - users
  /audit:
    get:
      parameters:
      - description: Page number (1-based)
        in: query
        name: page
        type: integer
      - description: Page size (default 50, max 500)
        in: query
        name: per_page
        type: integer
      - description: Search action, detail, IP or user name
        in: query
        name: q
        type: string
      - description: Only these actions (comma-separated)
        in: query
        name: actions
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List audit log (paginated)
      tags:
      - audit
  /audit/export:
    get:
      parameters:
      - description: Search action, detail, IP or user name
        in: query
        name: q
        type: string
      - description: Only these actions (comma-separated)
        in: query
        name: actions
        type: string
      produces:
      - text/csv
      responses:
        "200":
          description: OK
      security:
      - BearerAuth: []
      summary: Export the audit log (CSV)
      tags:
      - audit
  /audit/verify:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/audit.VerifyResult'
      security:
      - BearerAuth: []
      summary: Verify audit-log integrity
      tags:
      - audit
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.tokenResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Log in
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token to revoke
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.refreshRequest'
      responses:
        "204":
          description: No Content
      summary: Log out
      tags:
      - auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - auth
  /auth/oidc/callback:
    get:
      responses: {}
      summary: OIDC callback
      tags:
      - auth
  /auth/oidc/config:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.oidcConfigDTO'
      security:
      - BearerAuth: []
      summary: Get OIDC config
      tags:
      - auth
    put:
      consumes:
      - application/json
      parameters:
      - description: OIDC settings
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.oidcConfigDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.oidcConfigDTO'
      security:
      - BearerAuth: []
      summary: Update OIDC config
      tags:
      - auth
  /auth/oidc/exchange:
    post:
      consumes:
      - application/json
      parameters:
      - description: One-time code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.oidcExchangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.tokenResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Exchange an SSO code for tokens
      tags:
      - auth
  /auth/oidc/login:
    get:
      responses: {}
      summary: Begin OIDC login
      tags:
      - auth
  /auth/oidc/test:
    post:
      consumes:
      - application/json
      parameters:
      - description: Issuer URL
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.oidcTestRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Test OIDC discovery
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.refreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.tokenResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh access token
      tags:
      - auth
  /auth/step-up:
    post:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.tokenResponse'
      security:
      - BearerAuth: []
      summary: Step-up re-authentication (password)
      tags:
      - auth
  /auth/step-up/webauthn/begin:
    post:
      responses: {}
      security:
      - BearerAuth: []
      summary: Step-up re-authentication (passkey, begin)
      tags:
      - auth
  /auth/step-up/webauthn/finish:
    post:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.tokenResponse'
      security:
      - BearerAuth: []
      summary: Step-up re-authentication (passkey, finish)
      tags:
      - auth
  /auth/webauthn/login/begin:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Begin passwordless passkey login
      tags:
      - auth
  /auth/webauthn/login/finish:
    post:
      parameters:
      - description: Session id from begin
        in: query
        name: sid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.tokenResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Finish passkey login
      tags:
      - auth
  /backup/export:
    post:
      consumes:
      - application/json
      parameters:
      - description: Optional passphrase
        in: body
        name: body
        schema:
          $ref: '#/definitions/api.backupExportRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: file
      security:
      - BearerAuth: []
      summary: Export an encrypted backup
      tags:
      - backup
  /backup/run:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backup.LastRun'
      security:
      - BearerAuth: []
      summary: Run the scheduled backup now
      tags:
      - backup
  /backup/schedule:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.backupScheduleView'
      security:
      - BearerAuth: []
      summary: Scheduled backups
      tags:
      - backup
    put:
      consumes:
      - application/json
      parameters:
      - description: Schedule
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/backup.Schedule'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.backupScheduleView'
      security:
      - BearerAuth: []
      summary: Set scheduled backups
      tags:
      - backup
  /branding:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.brandingResponse'
      summary: Get branding
      tags:
      - settings
  /calendar:
    get:
      parameters:
      - description: RFC 3339 start
        in: query
        name: from
        required: true
        type: string
      - description: RFC 3339 end
        in: query
        name: to
        required: true
        type: string
      - description: First date for tasks
        in: query
        name: from_date
        type: string
      - description: Last date for tasks
        in: query
        name: to_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.calendarResponse'
      security:
      - BearerAuth: []
      summary: My calendar, all workspaces
      tags:
      - calendar
  /catalog:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Modules and workspace templates
      tags:
      - workspaces
  /events/{id}:
    delete:
      parameters:
      - description: Event id
        in: path
        name: id
        required: true
        type: string
      - description: RFC 3339 start of the one occurrence to remove
        in: query
        name: occurrence
        type: string
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete an event or one occurrence
