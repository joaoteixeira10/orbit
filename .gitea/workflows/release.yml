# Release — tag the current main HEAD and create the Gitea release. Manual trigger.
#
# Does NOT build the image — run "Build & Push" first for the same version.
# Creates git tag + release `v<version>`. The release body is a curated "what's
# new" summary lifted from CHANGELOG.md (the `## [<version>]` section, falling
# back to `## [Unreleased]`) followed by the auto-generated commit list since the
# previous tag.
#
# The Gitea release is created with the built-in Actions token; set a
# RELEASE_TOKEN secret (write:repository) if the default token lacks scope.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, bare semver e.g. 1.3.0 (tag/release → v1.3.0)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # full history + tags for the changelog
          fetch-tags: true

      - name: Create tag + release with changelog
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN || github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          git config --global --add safe.directory "$PWD"
          TAG="v${VERSION}"

          # Auto-generated commit list since the previous release tag.
          # Release tags only (vX.Y.Z) — skips markers like v0-python.
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="${PREV}..HEAD"; else RANGE=""; fi
          COMMITS=$(git log --no-merges --pretty='- %s (%h)' $RANGE)
          [ -z "$COMMITS" ] && COMMITS="- (no changes recorded)"

          # Curated highlights from CHANGELOG.md: the section for this version,
          # else the [Unreleased] section. Grabs lines after the matching
          # `## [...]` heading up to the next `## ` heading (### subheadings kept).
          extract() {
            awk -v want="$1" '
              /^##[[:space:]]/ { if (grab) exit; if (index(tolower($0), tolower(want))) { grab=1; next } }
              grab { print }
            ' CHANGELOG.md 2>/dev/null
          }
          # trim leading/trailing blank lines, keep internal ones
          trim() {
            awk '{ l[NR]=$0 } END {
              s=1; while (s<=NR && l[s] ~ /^[[:space:]]*$/) s++
              e=NR; while (e>=s && l[e] ~ /^[[:space:]]*$/) e--
              for (i=s;i<=e;i++) print l[i]
            }'
          }
          HIGHLIGHTS=""
          if [ -f CHANGELOG.md ]; then
            HIGHLIGHTS=$(extract "[${VERSION}]")
            [ -z "$(printf '%s' "$HIGHLIGHTS" | tr -d '[:space:]')" ] && HIGHLIGHTS=$(extract "[unreleased]")
            HIGHLIGHTS=$(printf '%s\n' "$HIGHLIGHTS" | trim)
          fi

          if [ -n "$PREV" ]; then CHANGEHDR="**All changes since ${PREV}:**"; else CHANGEHDR="**All changes:**"; fi
          if [ -n "$(printf '%s' "$HIGHLIGHTS" | tr -d '[:space:]')" ]; then
            BODY=$(printf '## What'"'"'s new\n\n%s\n\n---\n\n%s\n\n%s\n' "$HIGHLIGHTS" "$CHANGEHDR" "$COMMITS")
          else
            BODY=$(printf '%s\n\n%s\n' "$CHANGEHDR" "$COMMITS")
          fi

          payload=$(jq -nc --arg t "$TAG" --arg c "$GITHUB_SHA" --arg b "$BODY" \
            '{tag_name:$t, target_commitish:$c, name:$t, body:$b}')

          code=$(curl -s -o /tmp/rel.json -w '%{http_code}' \
            -X POST "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/releases" \
            -H "Authorization: token ${TOKEN}" -H 'Content-Type: application/json' \
            -d "$payload")
          echo "release API: $code"; cat /tmp/rel.json; echo
          # 201 = created. (409 would mean the tag/release already exists.)
          [ "$code" = "201" ]
          jq -r .id /tmp/rel.json > /tmp/rel.id
