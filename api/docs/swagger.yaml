        type: string
      s3_endpoint:
        description: host[:port] (MinIO, …); empty = AWS
        type: string
      s3_prefix:
        type: string
      s3_region:
        type: string
    type: object
  api.bookmarkRequest:
    properties:
      description:
        maxLength: 700
        type: string
      notes:
        maxLength: 20000
        type: string
      read:
        description: 'opened: true sets ReadAt, false clears it'
        type: boolean
      read_later:
        type: boolean
      tags:
        items:
          type: string
        type: array
      title:
        maxLength: 300
        type: string
      url:
        type: string
    type: object
  api.bookmarkResponse:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      has_image:
        type: boolean
      id:
        type: string
      notes:
        type: string
      read_at:
        type: string
      read_later:
        type: boolean
      site_name:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      updated_at:
        type: string
      url:
        type: string
      workspace_id:
        type: string
    type: object
  api.brandingResponse:
    properties:
      accent_color:
        type: string
      app_name:
        type: string
      asset_source_favicon:
        description: theme | keep
        type: string
      asset_source_logo:
        description: theme | keep
        type: string
      asset_source_wordmark:
        description: theme | keep
        type: string
      auto_sso:
        description: login page auto-starts SSO (unless ?local=1)
        type: boolean
      developer_theme:
        description: blue | gold | red | ink | green
        type: string
      developer_themes_enabled:
        type: boolean
      developer_themes_personal:
        type: boolean
      drawio_url:
        description: where Diagrams load the draw.io editor from
        type: string
      favicon_data_url:
        type: string
      hide_local_login:
        description: hide the password form on /login (when SSO is available)
        type: boolean
      login_message:
        type: string
      logo_data_url:
        type: string
      oidc_enabled:
        description: SPA shows the "Sign in with SSO" button
        type: boolean
      passwordless_enabled:
        description: SPA shows the "Sign in with a passkey" button
        type: boolean
      show_app_name:
        type: boolean
      show_logo:
        description: show the sidebar/login logo mark
        type: boolean
    type: object
  api.caldavAccountRequest:
    properties:
      password:
        maxLength: 500
        type: string
      url:
        maxLength: 1000
        type: string
      username:
        maxLength: 255
        type: string
    required:
    - password
    - url
    - username
    type: object
  api.caldavLinkRequest:
    properties:
      calendar_name:
        maxLength: 200
        type: string
      calendar_url:
        maxLength: 1000
        type: string
      password:
        maxLength: 500
        type: string
      url:
        maxLength: 1000
        type: string
      username:
        maxLength: 255
        type: string
    required:
    - calendar_url
    - password
    - url
    - username
    type: object
