# GitHub only: Gitea runs .gitea/workflows and ignores this folder. Tests run
# there and locally, not here — this repo is the same code, released after
# Gitea (see docs/RELEASING.md).
#
# Build & Push — ONE multi-arch build, pushed to this repo's GitHub Container
# Registry (ghcr.io/<owner>/<repo>, shows up under the repo "Packages").
# Manual trigger.
#
# Version: type it bare (1.3.0) or with a leading v (v1.3.0) — it's normalized
# either way. The image tag gets the "v"; the VERSION build-arg stays bare.
# Pre-releases (1.3.0-rc.1) are pushed as :v<version> only, never :latest.
#
# Uses the built-in GITHUB_TOKEN — no secrets needed. The image path is
# derived from the repo, nothing hard-coded.
name: Build & Push

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, semver e.g. 1.3.0 (image → :v1.3.0 + :latest)"
        required: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # Normalize + validate the version, decide whether :latest applies,
      # derive the image path, and stamp build time / short commit.
      - name: Resolve version + image
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$(echo "${INPUT_VERSION}" | tr -d '[:space:]')"
          VERSION="${VERSION#v}"
          if ! echo "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::'${INPUT_VERSION}' is not a valid semver version (expected e.g. 1.3.0)"
            exit 1
          fi
          # Docker tags can't contain '+', so drop build metadata from the tag.
          TAG="v${VERSION%%+*}"
          IMAGE="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "VERSION=${VERSION}"
            echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)"
            echo "TAGS<<EOF"
            echo "${IMAGE}:${TAG}"
            case "${VERSION}" in
              *-*) ;;                       # pre-release: no :latest
              *)   echo "${IMAGE}:latest" ;;
            esac
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "Building ${IMAGE}:${TAG} (bare version: ${VERSION})"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.SHORT_SHA }}
            BUILD_TIME=${{ env.BUILD_TIME }}
            REPO_URL=${{ github.server_url }}/${{ github.repository }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ env.BUILD_TIME }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ env.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
