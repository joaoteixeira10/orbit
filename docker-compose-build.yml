# Orbit v1 — build from source instead of pulling (air-gapped hosts, local
# changes). `make up-build` fills VERSION / COMMIT / BUILD_TIME from git.
# Same env, port and data volume as docker-compose.yml (the volume name is
# shared, so switching between built and pulled keeps the data).

services:
  api:
    build:
      context: .
      args:
        VERSION: ${VERSION:-}
        COMMIT: ${COMMIT:-}
        BUILD_TIME: ${BUILD_TIME:-}
    image: orbit:local
    ports:
      - "${ORBIT_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      GIN_MODE: release
      DB_DRIVER: sqlite
      DB_URL: /data/orbit.db
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ORBIT_MASTER_KEY: ${ORBIT_MASTER_KEY:?set ORBIT_MASTER_KEY in .env}
    volumes:
      - orbit-data:/data
    restart: unless-stopped

volumes:
  orbit-data:
